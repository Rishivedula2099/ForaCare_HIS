{% extends "base.html" %}
{% block content %}
<div class="grid">
  <div class="field"><div class="label">Receipt No.</div><div class="value">{{ receipt.receipt_number }}</div></div>
  <div class="field"><div class="label">Date</div><div class="value">{{ issued_at }}</div></div>
  <div class="field"><div class="label">Patient</div><div class="value">{{ patient_name }}</div></div>
  <div class="field"><div class="label">UID / MRN</div><div class="value">{{ patient.uid }} / {{ patient.mrn }}</div></div>
</div>
<div class="amount">Amount: {{ facility.currency }} {{ "{:,.2f}".format(receipt.amount) }}</div>
{% endblock %}
