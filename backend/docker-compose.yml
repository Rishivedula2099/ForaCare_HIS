services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forahis
      POSTGRES_PASSWORD: forahis
      POSTGRES_DB: forahis
    ports:
      - "5432:5432"
    volumes:
      - forahis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forahis -d forahis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forahis_postgres_data:
