[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "forahis-backend"
version = "0.1.0"
description = "ForaCare HIS backend - FastAPI foundation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    "email-validator>=2.2.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.4.0",
    # P6-B08: lab report PDF generation - fpdf2 renders the document itself
    # (header/table/signature block natively, plus its built-in Code39
    # barcode primitive for the accession barcode); qrcode renders the
    # verification QR as an image fpdf2 embeds (fpdf2 has no native QR
    # support).
    "fpdf2>=2.8.0",
    "qrcode[pil]>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
