name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forahis
          POSTGRES_PASSWORD: forahis
          POSTGRES_DB: forahis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forahis -d forahis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://forahis:forahis@localhost:5432/forahis
      JWT_ACCESS_SECRET_KEY: ci-only-access-secret
      JWT_REFRESH_SECRET_KEY: ci-only-refresh-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run Alembic migrations (upgrade head)
        run: python -m alembic upgrade head

      - name: Verify downgrade/upgrade round-trip
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Run backend test suite
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check & build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t forahis-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t forahis-frontend:ci ./frontend
