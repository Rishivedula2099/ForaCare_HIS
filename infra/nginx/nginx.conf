worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Request-size and rate limits (P1-B13): a slow-loris of oversized
    # bodies or a brute-force login loop hits these before it ever reaches
    # the app.
    client_max_body_size 10m;
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers - applied to every response this proxy serves,
        # keeping the backend's internal topology and any framework banner
        # headers out of what reaches the browser.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        proxy_hide_header X-Powered-By;
        server_tokens off;

        location /api/auth/login {
            limit_req zone=api_auth burst=5 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api_general burst=40 nodelay;
            proxy_pass http://backend_upstream;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frontend_upstream;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
