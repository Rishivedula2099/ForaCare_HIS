# P10-S01: production proxy headers. nginx is the TLS edge, so it states the
# facts itself rather than relaying whatever the client sent:
#   - X-Forwarded-For is REPLACED with the (real_ip-resolved) peer address, so a
#     client-supplied value can never reach the API's rate limiter.
#   - X-Forwarded-Proto is the literal scheme of this listener (https).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# P10-S02: one correlation id from the edge to the API logs. nginx generates it,
# never trusting a client-sent value, and returns it to the caller below.
proxy_set_header X-Request-ID $request_id;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
proxy_connect_timeout 5s;
